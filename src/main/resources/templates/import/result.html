<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<section th:fragment="result" class="stack">
    <h2>Result</h2>
    <div class="alert" th:classappend="${result.ordersRejected == 0} ? 'alert-ok' : 'alert-error'" role="status"
         th:text="|Imported ${result.ordersImported} of ${result.ordersImported + result.ordersRejected} orders (${result.rowsOk} rows ok, ${result.rowsFailed} rows failed) in ${result.durationMs} ms.|">
        Imported …
    </div>
    <p th:if="${result.ordersImported > 0}">
        <a th:href="@{/orders(status='NEW')}">View NEW orders →</a>
    </p>
    <div class="table-wrap" th:if="${!result.errors.isEmpty()}">
        <table>
            <thead>
            <tr>
                <th>Line</th>
                <th>external_ref</th>
                <th>Problem</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="e : ${result.errors}">
                <td th:text="|Line ${e.lineNo}|">Line 2</td>
                <td class="mono" th:text="${e.externalRef}">EXT-1</td>
                <td th:text="${e.message}">message</td>
            </tr>
            </tbody>
        </table>
    </div>
    <p class="muted" th:if="${result.errors.size() >= 200}">Only the first 200 problems are shown.</p>
</section>
</body>
</html>
