<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Error · OrderManager</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="login-page">
<main class="login-card">
    <h1 th:text="${status} ?: 'Error'">Error</h1>
    <p th:text="${message != null and !#strings.isEmpty(message)} ? ${message} : 'Something went wrong.'">Something went wrong.</p>
    <p><a th:href="@{/orders}">Back to orders</a></p>
</main>
</body>
</html>
